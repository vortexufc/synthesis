<!DOCTYPE html>
<html lang="pt-BR">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>$GODOT_PROJECT_NAME</title>
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">
		<style>
* {
	box-sizing: border-box;
}

html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
	width: 100%;
	height: 100%;
}

body {
	color: #ffffff;
	background-color: #080104;
	overflow: hidden;
	touch-action: none;
	font-family: 'Outfit', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
	user-select: none;
	-webkit-user-select: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status {
	position: absolute;
	top: 0;
	left: 0;
	right: 0;
	bottom: 0;
	background-color: #080104;
	background: radial-gradient(circle at 50% 45%, #2a0812 0%, #150308 55%, #070103 100%);
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
	z-index: 100;
}

#vortex-centerpiece {
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	position: relative;
	margin-bottom: 70px;
	pointer-events: none;
}

.vortex-glow-bg {
	position: absolute;
	width: 320px;
	height: 320px;
	background: radial-gradient(circle, rgba(230, 0, 57, 0.4) 0%, rgba(160, 0, 40, 0.15) 50%, transparent 75%);
	filter: blur(35px);
	pointer-events: none;
	animation: glow-pulse 3.5s ease-in-out infinite alternate;
}

@keyframes glow-pulse {
	0% {
		opacity: 0.7;
		transform: scale(0.95);
	}
	100% {
		opacity: 1;
		transform: scale(1.1);
	}
}

#status-splash {
	width: 220px;
	height: 220px;
	max-width: 70vw;
	max-height: 40vh;
	object-fit: contain;
	position: relative;
	z-index: 2;
	filter: drop-shadow(0 0 30px rgba(230, 0, 57, 0.8)) drop-shadow(0 0 60px rgba(180, 0, 40, 0.45));
	animation: vortex-float 3.5s ease-in-out infinite;
}

@keyframes vortex-float {
	0%, 100% {
		transform: translateY(0px) scale(1);
	}
	50% {
		transform: translateY(-8px) scale(1.02);
	}
}

.vortex-brand {
	text-align: center;
	position: relative;
	z-index: 2;
	margin-top: 14px;
}

.vortex-title {
	margin: 0;
	padding: 0;
	font-family: 'Outfit', 'Segoe UI', sans-serif;
	font-size: 38px;
	font-weight: 900;
	letter-spacing: 6px;
	text-transform: uppercase;
	background: linear-gradient(180deg, #ffffff 15%, #ff8aa0 55%, #e60039 100%);
	-webkit-background-clip: text;
	-webkit-text-fill-color: transparent;
	filter: drop-shadow(0 0 20px rgba(230, 0, 57, 0.65));
	line-height: 1.1;
}

.vortex-subtitle {
	font-family: 'Outfit', 'Segoe UI', sans-serif;
	font-size: 13px;
	font-weight: 600;
	letter-spacing: 5px;
	color: #ff6b8b;
	text-transform: uppercase;
	opacity: 0.85;
	margin-top: 6px;
	display: block;
	text-shadow: 0 0 10px rgba(255, 77, 109, 0.4);
}

#loading-container {
	position: absolute;
	bottom: 11%;
	display: flex;
	flex-direction: column;
	align-items: center;
	gap: 10px;
	width: 100%;
}

#loading-label {
	font-family: 'Outfit', 'Segoe UI', sans-serif;
	font-size: 14px;
	font-weight: 600;
	letter-spacing: 2px;
	color: #ff99aa;
	text-transform: uppercase;
	text-shadow: 0 0 10px rgba(230, 0, 57, 0.7);
}

#status-progress {
	width: 360px;
	max-width: 80vw;
	height: 12px;
	margin: 0 auto;
	border-radius: 6px;
	overflow: hidden;
	background: rgba(20, 2, 8, 0.85);
	border: 1px solid rgba(255, 60, 100, 0.45);
	box-shadow: 0 0 20px rgba(230, 0, 57, 0.35), inset 0 0 8px rgba(0, 0, 0, 0.8);
}

#status-progress::-webkit-progress-bar {
	background: rgba(20, 2, 8, 0.85);
}

#status-progress::-webkit-progress-value {
	background: linear-gradient(90deg, #8b0022, #e60039, #ff3366);
	border-radius: 6px;
	box-shadow: 0 0 12px #ff2a55;
}

#status-progress::-moz-progress-bar {
	background: linear-gradient(90deg, #8b0022, #e60039, #ff3366);
	border-radius: 6px;
	box-shadow: 0 0 12px #ff2a55;
}

#start-prompt {
	display: none;
	position: absolute;
	bottom: 10%;
	flex-direction: column;
	align-items: center;
	gap: 10px;
	cursor: pointer;
	z-index: 10;
}

.btn-start-game {
	background: linear-gradient(135deg, #990024 0%, #e60039 50%, #ff2a55 100%);
	color: #ffffff;
	border: 2px solid #ff708d;
	border-radius: 8px;
	padding: 16px 44px;
	font-family: 'Outfit', 'Segoe UI', sans-serif;
	font-size: 18px;
	font-weight: 800;
	letter-spacing: 3px;
	text-transform: uppercase;
	cursor: pointer;
	box-shadow: 0 0 25px rgba(230, 0, 57, 0.7), inset 0 0 12px rgba(255, 255, 255, 0.25);
	transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
	animation: vortex-pulse 1.8s ease-in-out infinite alternate;
}

.btn-start-game:hover {
	transform: translateY(-2px) scale(1.05);
	background: linear-gradient(135deg, #b80030 0%, #ff1a4f 50%, #ff4d73 100%);
	box-shadow: 0 0 40px rgba(255, 42, 85, 0.95), inset 0 0 18px rgba(255, 255, 255, 0.4);
	border-color: #ffffff;
}

.btn-start-game:active {
	transform: scale(0.98);
}

.start-hint {
	font-family: 'Outfit', 'Segoe UI', sans-serif;
	font-size: 12px;
	color: #cc7a8d;
	letter-spacing: 1.5px;
	text-shadow: 0 0 6px rgba(0, 0, 0, 0.8);
}

@keyframes vortex-pulse {
	0% {
		box-shadow: 0 0 18px rgba(230, 0, 57, 0.45), inset 0 0 8px rgba(255, 255, 255, 0.2);
		border-color: #ff6b8b;
	}
	100% {
		box-shadow: 0 0 35px rgba(255, 42, 85, 0.85), inset 0 0 16px rgba(255, 255, 255, 0.35);
		border-color: #ffffff;
	}
}

#status-notice {
	display: none;
	background-color: #5b202a;
	border-radius: 0.5rem;
	border: 1px solid #9b2030;
	color: #f0e0e0;
	font-family: 'Outfit', 'Segoe UI', sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
		<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Seu navegador não suporta a tag canvas.
		</canvas>

		<noscript>
			Seu navegador não possui JavaScript ativado.
		</noscript>

		<div id="status">
			<div id="vortex-centerpiece">
				<div class="vortex-glow-bg"></div>
				<img id="status-splash" src="vortex.gif" alt="Vortex - UFC">
				<div class="vortex-brand">
					<h1 class="vortex-title">VORTEX - UFC</h1>
					<span class="vortex-subtitle">PROJETO SYNTHESIS</span>
				</div>
			</div>

			<div id="loading-container">
				<div id="loading-label">Carregando... 0%</div>
				<progress id="status-progress"></progress>
			</div>

			<div id="start-prompt">
				<button class="btn-start-game" id="btn-start">&#9654; CLIQUE PARA INICIAR</button>
				<span class="start-hint">(ou pressione qualquer tecla)</span>
			</div>

			<div id="status-notice"></div>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const loadingContainer = document.getElementById('loading-container');
	const statusProgress = document.getElementById('status-progress');
	const loadingLabel = document.getElementById('loading-label');
	const startPrompt = document.getElementById('start-prompt');
	const btnStart = document.getElementById('btn-start');
	const statusNotice = document.getElementById('status-notice');
	const canvas = document.getElementById('canvas');

	let initializing = true;
	let statusMode = '';
	let userInteracted = false;
	let gameLoaded = false;

	function unlockAudio() {
		userInteracted = true;
		try {
			const AudioCtx = window.AudioContext || window.webkitAudioContext;
			if (AudioCtx) {
				const ctx = new AudioCtx();
				ctx.resume().then(() => {
					setTimeout(() => { try { ctx.close(); } catch(e){} }, 500);
				});
			}
		} catch (e) {
			console.warn('AudioContext unlock:', e);
		}
	}

	function onUserGesture() {
		unlockAudio();
		if (gameLoaded) {
			startGameplay();
		}
	}

	window.addEventListener('pointerdown', onUserGesture, { capture: true });
	window.addEventListener('keydown', onUserGesture, { capture: true });
	window.addEventListener('touchstart', onUserGesture, { capture: true });

	function startGameplay() {
		if (!initializing) return;
		unlockAudio();
		setStatusMode('hidden');
		try {
			canvas.focus();
			const evt = new MouseEvent('mousedown', { bubbles: true, cancelable: true, view: window });
			canvas.dispatchEvent(evt);
		} catch (e) {}
	}

	if (btnStart) {
		btnStart.addEventListener('click', (e) => {
			e.stopPropagation();
			startGameplay();
		});
	}

	if (statusOverlay) {
		statusOverlay.addEventListener('click', () => {
			if (gameLoaded) {
				startGameplay();
			}
		});
	}

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		if (loadingContainer) loadingContainer.style.display = mode === 'progress' ? 'flex' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('Ocorreu um erro ao carregar o jogo.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Falha no Service worker.'));
			}
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker já existe.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				window.location.reload();
			}).catch((err) => {
				console.error('Erro ao registrar service worker:', err);
			});
		} else {
			const missingMsg = 'Erro\nRecursos necessários para rodar no navegador estão ausentes:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
					var percent = Math.floor((current / total) * 100);
					if (loadingLabel) loadingLabel.textContent = 'Carregando... ' + percent + '%';
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			gameLoaded = true;
			const hasActive = (navigator.userActivation && navigator.userActivation.hasBeenActive) || userInteracted;
			if (hasActive) {
				startGameplay();
			} else {
				if (loadingContainer) loadingContainer.style.display = 'none';
				if (startPrompt) {
					startPrompt.style.display = 'flex';
				}
			}
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
